<!DOCTYPE html>
<html lang="en" class="atlas-theme">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="/static/favicon.svg" />
	<link rel="apple-touch-icon" href="/static/assets/atlas/hero.jpg" />
	<link rel="manifest" href="/static/static/manifest.json" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>ATLAS - Advanced Technologies & Logistics AI System</title>
	<meta property="og:title" content="ATLAS - Omniscient AI System" />
	<meta property="og:description" content="The most powerful, extensible AI platform designed to operate entirely offline" />
	<meta property="og:image" content="/static/assets/atlas/bg4.jpg" />
	<meta name="theme-color" content="#00ffff" />
		<meta name="description" content="The most powerful, extensible AI platform designed to operate entirely offline. Multi-agent collaboration, advanced workflows, and enterprise-ready features." />
		<link rel="stylesheet" href="/static/static/custom.css" />
	<link rel="stylesheet" href="/static/static/auth-fix.css" />
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600&family=Exo+2:wght@300;400;600&display=swap" rel="stylesheet">
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="atlas-body">
		<div style="display: contents" class="atlas-app">%sveltekit.body%</div>
		
		<script>
			// ATLAS initialization
			window.ATLAS = {
				version: '1.0.0',
				theme: 'atlas',
				initialized: true
			};
			
			// Add ATLAS classes to body
			document.body.classList.add('atlas-theme', 'atlas-theme');
			
			// Console branding
			console.log('%c🌟 ATLAS v1.0.0', 'color: #00ffff; font-size: 20px; font-weight: bold;');
			console.log('%cAdvanced Technologies & Logistics AI System', 'color: #0099ff; font-size: 14px;');
		</script>
	</body>
</html>
